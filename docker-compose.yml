# Local container testing before deploying to EC2. Requires the NVIDIA Container
# Toolkit on the Docker host for GPU passthrough to the `ollama` service —
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#
#   docker compose up --build
#   curl http://localhost:8000/health
#
# Without a GPU, drop the `deploy:` block on `ollama` — it will fall back to CPU
# inference, which is far slower (see docs/02-technical/tech-spec.md § 5.1) but still
# correct, which is enough to smoke-test the container wiring itself.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: tells the running `ollama` service to pull the model, then exits.
  # `ollama pull` is a thin client over OLLAMA_HOST — it needs no local server of
  # its own, so this doesn't need the models volume mounted.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["ollama", "pull", "qwen3.5:4b"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_KEEP_ALIVE: "30m"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
