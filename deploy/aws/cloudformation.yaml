AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IELTS-AI-Evaluator demo deploy - a single GPU EC2 instance running Ollama
  (qwen3.5:4b) natively plus the FastAPI app in Docker. Built for a demo/graded
  submission, not production traffic: one instance, no load balancer, no
  auto-scaling, no managed database. See docs/05-deployment/aws-deployment.md
  for cost, access, and teardown instructions - READ THE COST SECTION FIRST,
  this launches a billed GPU instance.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch into. Pick your default VPC unless you know you want another.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      A public subnet in the chosen VPC (must auto-assign a public IP, or the
      instance will have no reachable address for the API or SSH).

  InstanceType:
    Type: String
    Default: g4dn.xlarge
    AllowedValues: [g4dn.xlarge, g4dn.2xlarge, g5.xlarge]
    Description: >
      g4dn.xlarge (1x T4 16GB, ~$0.526/hr in us-east-1) comfortably fits the
      3.3GB qwen3.5:4b model. New AWS accounts often start with a G/VT instance
      vCPU quota of 0 - see the deployment doc for how to request an increase.

  KeyPairName:
    Type: String
    Default: ""
    Description: >
      Optional: an existing EC2 key pair name, for SSH access. Leave blank to
      rely solely on SSM Session Manager (recommended - no inbound port needed).

  SSHLocation:
    Type: String
    Default: ""
    Description: >
      Required only if KeyPairName is set: your IP in CIDR form (e.g. 203.0.113.5/32).
      Get it from `curl https://checkip.amazonaws.com`. Never leave this as 0.0.0.0/0.
    AllowedPattern: "^($|(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2})$"
    ConstraintDescription: Must be empty or a valid CIDR block.

  AppPort:
    Type: Number
    Default: 8000
    Description: Port the FastAPI app listens on and that is opened to the internet.

  AppPortCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: >
      CIDR allowed to reach AppPort. Default is open-to-internet for demo
      convenience - narrow this to your IP/32 if you don't need public access.

  OllamaModel:
    Type: String
    Default: qwen3.5:4b
    Description: Model pulled on first boot. Must match src/core/config.py's ollama_model.

  VolumeSizeGb:
    Type: Number
    Default: 100
    MinValue: 60
    Description: Root volume size - DLAMI base image + Docker images + model weights.

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # SSM Session Manager access - lets you get a shell without opening port 22
      # or managing a key pair at all: `aws ssm start-session --target <instance-id>`
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: IELTS-AI-Evaluator demo - app port, plus SSH if a key pair was given
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - HasKeyPair
          - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SSHLocation }
          - !Ref AWS::NoValue
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: !Ref AppPortCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"

  # Ollama's own API (11434) is deliberately NOT exposed here - the app container
  # reaches it over localhost on the same host. Exposing it publicly would let
  # anyone run arbitrary models on your billed GPU.

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      # Deep Learning Base OSS Nvidia Driver AMI (Ubuntu 24.04): NVIDIA driver,
      # Docker, and the NVIDIA Container Toolkit ship preinstalled, so user-data
      # only has to install Ollama and pull the model - nothing GPU-driver-related.
      ImageId: "{{resolve:ssm:/aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-24.04/latest/ami-id}}"
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSizeGb
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: ielts-ai-evaluator-demo }
        - { Key: Project, Value: IELTS-AI-Evaluator }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/iae-userdata.log) 2>&1

          echo "=== Installing Ollama ==="
          curl -fsSL https://ollama.com/install.sh | sh

          # Bind Ollama to localhost only (default) and keep the model warm so the
          # first API request isn't hit with a cold load - see
          # docs/02-technical/tech-spec.md section 5.1 for why keep_alive matters.
          mkdir -p /etc/systemd/system/ollama.service.d
          cat > /etc/systemd/system/ollama.service.d/override.conf <<'EOF'
          [Service]
          Environment="OLLAMA_KEEP_ALIVE=-1"
          EOF
          systemctl daemon-reload
          systemctl enable --now ollama

          echo "=== Waiting for Ollama to accept connections ==="
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done

          echo "=== Pulling ${OllamaModel} ==="
          ollama pull "${OllamaModel}"

          echo "=== Preparing app directory ==="
          # The GitHub Actions deploy workflow rsyncs the app source here and runs
          # `docker compose up -d --build` against docker-compose.prod.yml. This
          # script only prepares the machine; it does not deploy application code.
          mkdir -p /opt/iae
          chown -R ubuntu:ubuntu /opt/iae

          touch /var/log/iae-userdata-done
          echo "=== User-data complete ==="

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  ApiUrl:
    Value: !Sub "http://${Instance.PublicIp}:${AppPort}"
  HealthCheckUrl:
    Value: !Sub "http://${Instance.PublicIp}:${AppPort}/health"
  DocsUrl:
    Value: !Sub "http://${Instance.PublicIp}:${AppPort}/docs"
  SsmSessionCommand:
    Value: !Sub "aws ssm start-session --target ${Instance}"
  SshCommand:
    Condition: HasKeyPair
    Value: !Sub "ssh -i <path-to-${KeyPairName}.pem> ubuntu@${Instance.PublicIp}"
